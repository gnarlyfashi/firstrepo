[project]
name = "b-pkg"
version = "0.1.0"
description = "Bloom-Structured Prerequisite Graph (B-PKG) automation framework"
authors = [{ name = "Unknown" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.2.9",
  "langgraph>=0.1.19",
  "pydantic>=2.8.2",
  "python-dotenv>=1.0.1"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
